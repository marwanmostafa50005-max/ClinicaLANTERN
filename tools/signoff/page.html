<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign-off: ClinicaLANTERN</title>
<link rel="icon" href="/mark.svg">
<style>
/* The colours and type of ClinicaLANTERN (docs/SPEC.md section 8, src/styles/tokens.css). */
:root {
  --navy: #071d49; --gold: #edbf67; --cyan: #27c2d0; --cyan-dark: #0e7490; --gold-dark: #9a6200;
  --red: #b42318; --page: #f7f9fc; --text: #14233b;
  --muted: #4b5b76; --line: #d6deea; --line-soft: #e7ecf4; --card: #ffffff;
  --navy-tint: #eaeef6; --cyan-tint: #e5f8fa; --gold-tint: #fdf3dc; --red-tint: #fdeceb;
  --gold-ink: #5f3d00; --cyan-ink: #0b4f63; --red-ink: #8a1c12;
  --font-stack: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font: "Segoe UI Variable Text", "Segoe UI Variable", var(--font-stack);
  --font-display: "Segoe UI Variable Display", "Segoe UI Variable", var(--font-stack);
  --font-small: "Segoe UI Variable Small", "Segoe UI Variable", var(--font-stack);
  --mono: Consolas, "Cascadia Mono", "Courier New", monospace;
  --radius: 14px; --radius-small: 10px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html {
  font-optical-sizing: auto;
  font-kerning: normal;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  accent-color: var(--navy);
  scrollbar-color: var(--line) transparent;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  border: 2px solid transparent; border-radius: 999px; background: var(--line); background-clip: padding-box;
}
::selection { background: var(--gold-tint); color: var(--navy); }
body {
  margin: 0; display: flex; flex-direction: column; overflow: hidden;
  background: var(--page); color: var(--text); font-family: var(--font); font-size: 16px; line-height: 1.45;
}
button, input, textarea, select { font: inherit; color: inherit; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--navy); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- the top bar ---------- */
.bar {
  flex: none; display: flex; align-items: center; gap: 14px; min-height: 50px; padding: 4px 16px;
  background: var(--navy); color: #fff;
}
.bar :focus-visible { outline-color: var(--gold); }
.mark { flex: none; width: 34px; height: 34px; border-radius: 8px; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.4); }
.wordmark { flex: none; font-size: 1.3rem; font-weight: 300; white-space: nowrap; line-height: 1; }
.wordmark .wm-l { color: var(--gold); font-size: 1.3em; margin: 0 0.03em; }
.wordmark b { font-weight: 700; letter-spacing: 0.085em; }
.tool-name { flex: none; padding-left: 14px; border-left: 1px solid rgba(255, 255, 255, 0.3); font-weight: 600; white-space: nowrap; }
.counts { flex: none; display: flex; gap: 6px; margin-left: auto; }
.chip {
  display: inline-flex; align-items: baseline; gap: 5px; padding: 2px 9px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.22); font-size: 0.85rem; white-space: nowrap;
}
.chip b { font-size: 1.05rem; font-variant-numeric: tabular-nums lining-nums; }
.chip--signed b { color: #7fe3ec; }
.chip--change b, .chip--again b { color: var(--gold); }
button.chip { font: inherit; font-size: 0.85rem; color: var(--navy); background: var(--gold); border-color: var(--gold); font-weight: 600; cursor: pointer; }
button.chip:hover { background: #f5d48f; }
.progress { flex: none; display: grid; gap: 3px; width: 140px; font-size: 0.78rem; }
.progress-track { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: rgba(255, 255, 255, 0.2); }
.progress-track i { display: block; height: 100%; }
.seg-signed { background: var(--cyan); }
.seg-change { background: var(--gold); }
.seg-nd { background: repeating-linear-gradient(45deg, #9aa7bd 0 3px, #6c7a93 3px 6px); }
.who { flex: 0 1 auto; min-width: 0; display: flex; align-items: baseline; gap: 6px; font-size: 0.88rem; white-space: nowrap; }
.who-name { min-width: 0; max-width: 190px; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.who button { flex: none; padding: 0; border: 0; background: none; color: var(--gold); text-decoration: underline; cursor: pointer; font-size: 0.84rem; }

.filters {
  flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 7px; min-height: 46px; padding: 6px 16px;
  background: #fff; border-bottom: 1px solid var(--line); font-size: 0.86rem;
}
.filters input[type="search"], .filters select {
  height: 32px; padding: 2px 6px; border: 1.5px solid #b9c4d8; border-radius: 8px; background: #fff;
}
.filters input[type="search"] { width: 176px; }
.filters select { max-width: 150px; }
.filters label.tick { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; cursor: pointer; }
.filters .is-on { border-color: var(--navy); background: var(--navy-tint); font-weight: 600; }
.mini {
  height: 32px; padding: 2px 10px; border: 1.5px solid #b9c4d8; border-radius: 8px; background: #fff; color: var(--navy);
  font-weight: 600; cursor: pointer; white-space: nowrap;
}
.mini:hover:not(:disabled) { background: var(--navy-tint); border-color: var(--navy); }
.mini:disabled { color: #8a96ab; background: #f1f3f7; cursor: not-allowed; }
.keys { margin-left: auto; color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
.keys span { margin-left: 7px; }
kbd {
  display: inline-block; min-width: 1.5em; padding: 0 4px; border: 1px solid #b9c4d8; border-bottom-width: 2px; border-radius: 5px;
  background: #fff; color: var(--navy); font-family: var(--font); font-size: 0.78rem; font-weight: 700; text-align: center;
}
.alarm { flex: none; padding: 8px 16px; background: var(--red); color: #fff; font-weight: 600; }
.signoff-line {
  flex: none; padding: 7px 16px; background: var(--gold-tint); border-bottom: 1px solid #e7c98a;
  color: var(--gold-ink); font-size: 0.9rem; font-weight: 600;
}
.signoff-line.is-bad { background: var(--red-tint); border-color: #f1b5af; color: var(--red-ink); }
.final-test { margin-top: 6px; color: var(--navy); font-size: 0.95rem; line-height: 1.4; }
.final-test .ft-mark {
  display: inline-block; margin-right: 8px; padding: 1px 8px; border-radius: 999px; font-size: 0.72rem;
  font-weight: 700; letter-spacing: 0.04em; vertical-align: baseline;
}
.ft-mark--pass { background: var(--cyan-tint); color: var(--cyan-ink); border: 1px solid #a9e3ea; }
.ft-mark--fail { background: var(--red-tint); color: var(--red-ink); border: 1px solid #f1b5af; }
.ft-mark--wait { background: var(--gold-tint); color: var(--gold-ink); border: 1px solid #e7c98a; }
.ft-mark--plain { background: #fff; color: var(--muted); border: 1px solid var(--line); }
.row-set-aside { opacity: 0.72; }
.row-set-aside .row-title::after { content: ' · Set aside'; color: var(--red-ink); font-weight: 600; }

/* ---------- the three columns ---------- */
.work { flex: 1; min-height: 0; display: grid; grid-template-columns: 252px minmax(0, 1fr) 404px; }
.list { overflow-x: hidden; overflow-y: auto; background: #fff; border-right: 1px solid var(--line); }
.sheet { overflow: auto; padding: 16px 22px 70px; outline: none; }
.side { overflow: auto; background: #fff; border-left: 1px solid var(--line); padding: 12px 16px 40px; }

/* ---------- the list ---------- */
.list-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; padding: 7px 12px; color: var(--muted); font-size: 0.82rem; font-weight: 600; }
.list-head .link { padding: 0; font-size: 0.82rem; }
.row > span:last-child { min-width: 0; overflow: hidden; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; }
.row .final-test { font-size: 0.76rem; font-weight: 500; white-space: normal; line-height: 1.35; }
.list-warn { margin: 0 8px 6px; padding: 7px 10px; border: 1px solid #f1b5af; border-radius: 8px; background: var(--red-tint); color: var(--red-ink); font-size: 0.82rem; }
.list-section {
  position: sticky; top: 0; z-index: 1; padding: 5px 12px; background: var(--navy-tint); color: var(--navy);
  border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 0.76rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
}
.row {
  display: grid; grid-template-columns: 22px minmax(0, 1fr); align-items: center; gap: 8px; width: 100%; padding: 6px 10px 6px 10px;
  border: 0; border-bottom: 1px solid var(--line-soft); border-left: 4px solid transparent; background: #fff; text-align: left; cursor: pointer;
}
.row:hover { background: #f3f6fb; }
.row.is-current { background: var(--gold-tint); border-left-color: var(--gold-dark); }
.row-id { display: flex; align-items: baseline; gap: 6px; color: var(--navy); font-size: 0.86rem; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums lining-nums; }
.row-id small { margin-left: auto; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.04em; }
.row-id .r-pass { color: var(--cyan-dark); }
.row-id .r-fail { color: var(--red); }
.row-id .r-audit { color: var(--ink-soft, #5a6472); margin-left: 6px; }
.row-id .r-audit--you { color: var(--red); font-weight: 700; }
.audit-points { margin: 8px 0 0; padding-left: 18px; }
.audit-points li { margin: 6px 0; }
.audit-change { color: var(--ink-soft, #5a6472); margin-top: 3px; white-space: pre-wrap; }
.row-title { display: block; color: var(--muted); font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot {
  display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 2px solid #9aa7bd;
  color: #fff; font-size: 0.72rem; font-weight: 700; line-height: 1;
}
.s-signed .dot, .s-file_signed .dot { background: var(--cyan-dark); border-color: var(--cyan-dark); }
.s-change .dot, .s-nd_change .dot { background: var(--gold); border-color: var(--gold-dark); color: var(--navy); }
.s-look_again .dot { background: #fff; border-color: var(--red); color: var(--red); }
.s-nd_open .dot { border-style: dashed; color: #6c7a93; }
.s-nd_agreed .dot { background: #6c7a93; border-color: #6c7a93; }
.list-empty { padding: 16px 12px; color: var(--muted); font-size: 0.9rem; }
.list-foot { padding: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.78rem; overflow-wrap: anywhere; }
.list-foot p + p { margin-top: 6px; }

/* ---------- the criterion ---------- */
.sheet-inner { display: grid; gap: 16px; max-width: 900px; margin: 0 auto; }
.head-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.tag {
  display: inline-flex; align-items: center; padding: 2px 10px; border: 1px solid transparent; border-radius: 999px;
  background: var(--navy-tint); color: var(--navy); font-size: 0.8rem; font-weight: 600; white-space: nowrap;
}
.tag--warn { background: var(--gold-tint); border-color: #e7c98a; color: var(--gold-ink); }
.tag--red { background: var(--red-tint); border-color: #f1b5af; color: var(--red-ink); }
.tag--ok { background: var(--cyan-tint); border-color: #a9e3ea; color: var(--cyan-ink); }
.tag--plain { background: #fff; border-color: var(--line); color: var(--muted); font-family: var(--mono); font-weight: 400; }
.head-label { margin: 0; color: var(--navy); font-family: var(--font-display); font-size: 1.7rem; font-weight: 700; line-height: 1.15; }
.head-title { margin-top: 3px; font-size: 1.2rem; }
.head-plain { margin-top: 6px; color: var(--muted); }
.jump-row {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; padding: 6px 12px; border: 1px solid var(--line);
  border-radius: var(--radius-small); background: #fff; color: var(--muted); font-size: 0.86rem;
}
.jump-row .link { padding: 0; font-size: 0.86rem; }
.jump-row .link.is-changed { color: var(--red); }
.block h3, .side h3 {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 6px; color: var(--muted);
  font-size: 0.78rem; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase;
}
.block h3 .tag, .side h3 .tag { letter-spacing: 0; text-transform: none; }
.block p.body { font-size: 1.04rem; }
.quote {
  margin: 0; padding: 12px 16px; border-left: 4px solid var(--navy); border-radius: 0 var(--radius-small) var(--radius-small) 0;
  background: var(--navy-tint); color: var(--navy); font-size: 1.1rem; line-height: 1.5; white-space: pre-line; overflow-wrap: anywhere;
}
.quote.is-short { max-height: 17.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.quote-row + .quote-row { margin-top: 10px; padding-top: 10px; border-top: 1px solid #c9d3e6; }
.quote-row b { display: block; }
.quote-row span { display: block; font-size: 1rem; }
.credit { margin-top: 6px; color: var(--muted); font-size: 0.88rem; }
.link {
  padding: 2px 0; border: 0; background: none; color: var(--cyan-dark); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer;
}
.link:hover { color: var(--navy); }
.group { padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--radius-small); background: var(--card); }
.group + .group { margin-top: 8px; }
.group-name { color: var(--navy); font-weight: 700; }
.group-ing { margin-top: 2px; font-size: 1.04rem; }
.group-brands { margin-top: 4px; color: #33435e; font-size: 0.92rem; }
.group-brands i { color: var(--muted); font-style: normal; }
.group-note { margin-top: 4px; color: var(--muted); font-size: 0.88rem; }
.facts { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.facts li { padding: 8px 12px; border: 1px solid #e7c98a; border-radius: var(--radius-small); background: #fffaf0; }
.facts small { display: block; margin-top: 2px; color: var(--gold-ink); font-size: 0.9rem; }
.history { padding: 9px 14px; border: 1px solid var(--line); border-radius: var(--radius-small); background: var(--card); }
.history + .history { margin-top: 8px; }
.history-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.history-top .link { margin-left: auto; }
.history-file { color: var(--muted); font-family: var(--mono); font-size: 0.82rem; }
.history-about { margin-top: 4px; }
.rows-box { margin-top: 8px; max-height: 372px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
table.rows { width: 100%; border-collapse: collapse; font-size: 0.82rem; line-height: 1.35; }
table.rows th { position: sticky; top: 0; padding: 5px 6px; background: var(--navy-tint); color: var(--navy); text-align: left; font-size: 0.72rem; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
table.rows td { padding: 4px 6px; border-top: 1px solid var(--line-soft); vertical-align: top; }
table.rows td.id { color: var(--muted); font-family: var(--mono); white-space: nowrap; }
table.rows td.date, table.rows td.prescriber { white-space: nowrap; font-variant-numeric: tabular-nums lining-nums; }
table.rows tr.hit td { background: var(--gold-tint); color: #2e1e00; }
table.rows tr.hit td.id { color: var(--gold-dark); font-weight: 700; box-shadow: inset 4px 0 0 var(--gold-dark); }
table.rows tr.fact td { font-style: italic; }
.rows-note { margin-top: 6px; color: var(--muted); font-size: 0.84rem; }
.note { padding: 10px 14px; border: 1px solid var(--line); border-radius: var(--radius-small); background: #fff; }
.note--warn { background: var(--gold-tint); border-color: #e7c98a; color: var(--gold-ink); }
.note--error { background: var(--red-tint); border-color: #f1b5af; color: var(--red-ink); }
.note--ok { background: var(--cyan-tint); border-color: #a9e3ea; color: var(--cyan-ink); }
.file-line { color: var(--muted); font-size: 0.8rem; overflow-wrap: anywhere; }
.plain-pre { margin: 0; white-space: pre-wrap; font-family: var(--mono); font-size: 0.84rem; }

/* ---------- the side: decision, result, second opinion, doubts ---------- */
.pos { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 0.86rem; font-weight: 600; }
.status { margin-top: 6px; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius-small); background: var(--page); font-size: 0.95rem; }
.status--ok { background: var(--cyan-tint); border-color: #a9e3ea; color: var(--cyan-ink); }
.status--warn { background: var(--gold-tint); border-color: #e7c98a; color: var(--gold-ink); }
.status--again { background: var(--red-tint); border-color: #f1b5af; color: var(--red-ink); }
.status blockquote { margin: 5px 0 0; padding: 4px 0 4px 10px; border-left: 3px solid var(--gold-dark); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 8.5em; overflow: auto; }
.status .link { margin-right: 14px; font-size: 0.9rem; }
.status ul { margin: 4px 0 0; padding-left: 20px; }
.unsaved { margin-top: 6px; padding: 8px 12px; border: 1.5px solid var(--gold-dark); border-radius: var(--radius-small); background: var(--gold-tint); color: var(--gold-ink); font-size: 0.95rem; }
.unsaved .link { margin-right: 14px; font-size: 0.9rem; }
.big {
  display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; margin-top: 8px; border-radius: 12px;
  font-weight: 700; letter-spacing: 0.05em; cursor: pointer; transition: background-color 0.12s ease, transform 0.08s ease;
}
.big:active:not(:disabled) { transform: translateY(1px); }
.big--sign { min-height: 60px; border: 2px solid var(--navy); background: var(--navy); color: #fff; font-size: 1.3rem; }
.big--sign:hover:not(:disabled) { background: #0f2f73; }
.big--change { min-height: 50px; border: 2px solid var(--gold-dark); background: #fff; color: var(--gold-ink); font-size: 1.1rem; }
.big--change:hover:not(:disabled) { background: var(--gold-tint); }
.big:disabled { border-color: #dde3ec; background: #eef1f6; color: #6f7c93; cursor: not-allowed; }
.keycap { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 6px; border-radius: 6px; font-size: 0.84rem; letter-spacing: 0; }
.big--sign .keycap { background: var(--gold); color: var(--navy); }
.big--change .keycap { background: var(--gold-tint); border: 1px solid var(--gold-dark); }
.big:disabled .keycap { background: #dde3ec; color: #6f7c93; border: 0; }
.nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.nav .mini { height: 36px; padding: 2px 4px; }
.change-box { margin-top: 8px; padding: 10px 12px; border: 1.5px solid var(--gold-dark); border-radius: var(--radius-small); background: #fffaf0; }
.change-box label { display: block; color: var(--gold-ink); font-weight: 700; }
.change-box textarea { display: block; width: 100%; min-height: 104px; margin-top: 6px; padding: 8px 10px; border: 1.5px solid #b9c4d8; border-radius: 8px; background: #fff; resize: vertical; }
.change-box .row2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 8px; }
.change-box .hint { color: var(--muted); font-size: 0.8rem; }
.btn-solid { height: 36px; padding: 2px 14px; border: 0; border-radius: 8px; background: var(--navy); color: #fff; font-weight: 600; cursor: pointer; }
.btn-solid:hover { background: #0f2f73; }
.saved-note { margin-top: 8px; color: var(--muted); font-size: 0.8rem; }
.side section { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-soft); }
.side .small { color: var(--muted); font-size: 0.84rem; }
.side ul, .side ol { margin: 4px 0 0; padding-left: 22px; }
.side li { margin-top: 3px; }
.side li::marker { color: var(--muted); font-size: 0.86rem; }
.doubt + .doubt { margin-top: 10px; }
.doubt-from { color: var(--muted); font-size: 0.8rem; font-weight: 600; }
.doubt p { margin-top: 4px; }
.side details { margin-top: 8px; }
.side summary { cursor: pointer; color: var(--cyan-dark); font-weight: 600; font-size: 0.9rem; }
.side details > div { margin-top: 4px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--page); font-size: 0.9rem; }
.side details p + p { margin-top: 6px; }
code { font-family: var(--mono); font-size: 0.9em; }

/* ---------- the name box and the small messages ---------- */
.overlay { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(7, 29, 73, 0.55); }
.name-card { width: min(520px, 100%); padding: 24px 26px; border-radius: var(--radius); background: #fff; box-shadow: 0 20px 50px rgba(7, 29, 73, 0.4); border-top: 6px solid var(--gold); }
.name-card h2 { margin: 0 0 6px; color: var(--navy); font-size: 1.4rem; }
.name-card input { display: block; width: 100%; height: 46px; margin-top: 12px; padding: 4px 12px; border: 1.5px solid #b9c4d8; border-radius: var(--radius-small); font-size: 1.1rem; }
.name-card .row2 { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
.name-card .btn-solid { height: 44px; padding: 4px 22px; font-size: 1.05rem; }
.name-card .err { color: var(--red); font-weight: 600; }
.toast {
  position: fixed; left: 50%; bottom: 18px; z-index: 70; transform: translateX(-50%); max-width: min(640px, calc(100vw - 32px));
  padding: 10px 18px; border-radius: var(--radius); background: var(--navy); color: #fff; box-shadow: 0 14px 32px rgba(7, 29, 73, 0.36); font-weight: 600;
}
.toast.is-bad { background: var(--red); }
.empty { padding: 40px 18px; border: 1.5px dashed var(--line); border-radius: var(--radius); color: var(--muted); text-align: center; font-size: 1.05rem; }

@media (max-width: 1180px) {

  .tool-name { display: none; }
}
@media (max-width: 900px) {

  .work { display: block; }
  .list { max-height: 240px; border-right: 0; border-bottom: 1px solid var(--line); }
  .side { border-left: 0; border-top: 1px solid var(--line); }
  .keys, .progress { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition-duration: 0.01ms !important; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <img class="mark" src="/mark.svg" alt="">
    <div class="wordmark" aria-label="ClinicaLANTERN"><span aria-hidden="true">Clinica<span class="wm-l">L</span><b>ANTERN</b></span></div>

    <div class="counts" id="counts" aria-live="polite"></div>
    <div class="progress" id="progress"></div>
    <div class="who" id="who"></div>
  </div>
  <div class="signoff-line" id="signoff-line" aria-live="polite"></div>
  <div class="filters" role="search">
    <input type="search" id="q" placeholder="Search the list" title="Search by number, name or medicine" aria-label="Search the criteria by number, name or medicine" autocomplete="off" spellcheck="false">
    <select id="f-family" aria-label="Family"><option value="">All families</option></select>
    <select id="f-set" aria-label="Group">
      <option value="">All groups</option><option value="ten">First ten</option><option value="reserve">Reserves</option><option value="further">Further</option>
    </select>
    <select id="f-signoff" aria-label="Sign-off list"></select>
    <select id="f-status" aria-label="Decision" hidden>
      <option value="">Any decision</option><option value="todo">Not signed</option><option value="signed">Signed</option>
      <option value="change">Needs a change</option><option value="again">Look again</option><option value="nd">Not drafted</option>
    </select>
    <select id="f-result" aria-label="Scored result">
      <option value="">Any result</option><option value="pass">PASS</option><option value="fail">Not passing</option><option value="none">Not scored</option>
    </select>

      <option value="">Any opinion</option><option value="agree">Gemini agrees</option><option value="doubt">Gemini doubts</option><option value="none">No opinion yet</option>
    </select>

      <option value="">Any audit</option><option value="foryou">audit: for you</option>

      <option value="founder">audit: founder</option><option value="none">audit: not yet reported</option>
    </select>

    <span class="keys">Keys:<span><kbd>S</kbd> sign</span><span><kbd>C</kbd> needs a change</span><span><kbd>&larr;</kbd> <kbd>&rarr;</kbd> back, next</span><span><kbd>U</kbd> undo</span></span>

    <div class="row2">
      <button type="submit" class="btn-solid">Start</button>
      <button type="button" class="link" id="name-cancel" hidden>Cancel</button>
